services:
  backend:
    build:
      context: .
      dockerfile: PMM.API/Dockerfile
    container_name: pmm_backend
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      # appsettings.json'ı ezen, veritabanı ile aynı olan bağlantı ayarı:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pmm_db;Username=zeyd;Password=zeyd_zeyd
    depends_on:
      - db
    volumes:
      - pmm_files:/app/wwwroot/files
    networks:
      - proxy_network

  frontend:
    build:
      context: ./PMM.UI
      dockerfile: Dockerfile # Yeni Nginx'li Dockerfile
    container_name: pmm_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - proxy_network

  db:
    image: postgres:15-alpine
    container_name: pmm_db
    restart: always
    environment:
      - POSTGRES_USER=zeyd
      - POSTGRES_PASSWORD=zeyd_zeyd
      - POSTGRES_DB=pmm_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - proxy_network

volumes:
  db_data:
  pmm_files:

networks:
  proxy_network:
    external: true